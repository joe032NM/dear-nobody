<!DOCTYPE html>
<html>
<head>
    <title>Stories</title>
</head>
<body>

<h1>All Stories</h1>

{% if posts %}

    {% for post in posts %}

        <div style="border:1px solid #ccc; padding:20px; margin-bottom:20px;">

            <h2>{{ post.title }}</h2>

            <p>{{ post.content }}</p>

            <small>
                By {{ post.author }}
                <br>
                {{ post.created_at.strftime("%d %B %Y %H:%M") }}
            </small>

        </div>

    {% endfor %}

{% else %}

    <h3>No stories published yet.</h3>

{% endif %}

<a href="{{ url_for('new_story') }}">Write a Story</a>

</body>
</html>
