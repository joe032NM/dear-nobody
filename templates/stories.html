<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stories</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Stories</h1>

    {% for post in posts %}

        <article>

            <h2>
                <a href="{{ url_for('view_story', story_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>

            <p>
                By {{ post.author }}
            </p>

            <p>
                {{ post.content[:200] }}
                {% if post.content|length > 200 %}...{% endif %}
            </p>

            <a href="{{ url_for('view_story', story_id=post.id) }}">
                Read Story →
            </a>

        </article>

        <hr>

    {% else %}

        <p>No stories published yet.</p>

    {% endfor %}

</body>
</html>
