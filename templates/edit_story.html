<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Story</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Edit Story</h1>

    <form action="{{ url_for('edit_story', story_id=story.id) }}"
          method="POST">

        <input
            type="text"
            name="title"
            value="{{ story.title }}"
            required
        >

        <br><br>

        <textarea
            name="content"
            rows="15"
            cols="80"
            required
        >{{ story.content }}</textarea>

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('view_story', story_id=story.id) }}">
        Cancel
    </a>

</body>
</html>
