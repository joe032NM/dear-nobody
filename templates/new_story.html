<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Story</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Write a New Story</h1>

    <form action="{{ url_for('new_story') }}" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Story title"
            required
        >

        <br><br>

        <textarea
            name="content"
            rows="15"
            cols="80"
            placeholder="Write your story..."
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Publish Story
        </button>

    </form>

</body>
</html>
